version: '3.8'

services:
  web:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: daphne -b 0.0.0.0 -p 8001 core.asgi:application
    volumes:
      - ./backend:/app
    ports:
      - "8001:8001"
    environment:
      - POSTGRES_DB=netpulse_db
      - POSTGRES_USER=netpulse_user
      - POSTGRES_PASSWORD=netpulse_pass
      - POSTGRES_HOST=db
      - REDIS_URL=redis://redis:6379/0
      - DJANGO_SETTINGS_MODULE=core.settings
      - DJANGO_ALLOWED_HOSTS=*
      - CSRF_TRUSTED_ORIGINS=http://localhost:5173,http://localhost:5174,http://192.168.1.107:5173,http://192.168.1.107:5174,http://192.168.100.8:5173,http://192.168.100.8:8001
    depends_on:
      - db
      - redis

  celery_worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: celery -A core worker -l info
    volumes:
      - ./backend:/app
    environment:
      - POSTGRES_DB=netpulse_db
      - POSTGRES_USER=netpulse_user
      - POSTGRES_PASSWORD=netpulse_pass
      - POSTGRES_HOST=db
      - REDIS_URL=redis://redis:6379/0
      - DJANGO_SETTINGS_MODULE=core.settings
    depends_on:
      - db
      - redis

  db:
    image: postgres:15-alpine
    environment:
      - POSTGRES_DB=netpulse_db
      - POSTGRES_USER=netpulse_user
      - POSTGRES_PASSWORD=netpulse_pass
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

volumes:
  postgres_data:
